# Salvalo come .github/workflows/sync.yml nel repository (insieme a sync.mjs nella radice)
name: sync-como

on:
  schedule:
    - cron: '0 */3 * * *'   # ogni 3 ore; il primo giro lancialo a mano da Actions > Run workflow
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.mjs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          MAX_EVENTS: '120'
